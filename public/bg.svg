<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="120" />
    </filter>
    <radialGradient id="warm-peach" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFC6A0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFC6A0" stop-opacity="0"    />
    </radialGradient>
    <radialGradient id="warm-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F5B0C8" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#F5B0C8" stop-opacity="0"    />
    </radialGradient>
    <radialGradient id="warm-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F8DBA1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8DBA1" stop-opacity="0"    />
    </radialGradient>
    <radialGradient id="warm-mauve" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#D8C2F0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D8C2F0" stop-opacity="0"    />
    </radialGradient>
    <radialGradient id="warm-sky" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#BDD7F2" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#BDD7F2" stop-opacity="0"    />
    </radialGradient>
    <radialGradient id="warm-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C8E7CC" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#C8E7CC" stop-opacity="0"    />
    </radialGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFF6EC" />
      <stop offset="55%"  stop-color="#FBEFE2" />
      <stop offset="100%" stop-color="#F4E6E2" />
    </linearGradient>
  </defs>

  <!-- warm cream base -->
  <rect width="1920" height="1080" fill="url(#base)" />

  <!-- soft warm color blobs -->
  <g filter="url(#soft)">
    <ellipse cx="280"  cy="200"  rx="520" ry="420" fill="url(#warm-peach)" />
    <ellipse cx="1650" cy="120"  rx="560" ry="420" fill="url(#warm-gold)"  />
    <ellipse cx="1700" cy="900"  rx="520" ry="460" fill="url(#warm-blush)" />
    <ellipse cx="260"  cy="960"  rx="540" ry="440" fill="url(#warm-mauve)" />
    <ellipse cx="960"  cy="540"  rx="620" ry="380" fill="url(#warm-sky)"   />
    <ellipse cx="1100" cy="780"  rx="380" ry="320" fill="url(#warm-mint)"  />
  </g>
</svg>
